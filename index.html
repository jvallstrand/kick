<title>Kick</title>
<style>
:root{--bg:#1d2433;--ink:#fff;--muted:rgba(255,255,255,.72);--accent:#ff7a1a;--sky:#3ad1ff;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font:inherit;cursor:pointer}

/* HUD */
.hud{position:fixed;top:calc(var(--st) + 10px);left:calc(var(--sl) + 14px);right:calc(var(--sr) + 14px);
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.score{font-weight:800;font-size:22px;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.score small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;font-weight:800}

/* Joystick */
#stickZone{position:fixed;left:0;top:0;bottom:0;width:48vw}
#stickBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.4)}

/* Action buttons */
.act{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.75);color:#fff;font-weight:900;
  letter-spacing:.04em;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;
  box-shadow:0 4px 12px rgba(0,0,0,.35);touch-action:none}
.act.on{transform:scale(.92);filter:brightness(1.25)}
#bJump{width:96px;height:96px;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 22px);background:rgba(255,122,26,.85);font-size:18px}
#bWhip{width:74px;height:74px;right:calc(var(--sr) + 132px);bottom:calc(var(--sb) + 18px);background:rgba(58,209,255,.75);font-size:13px}
#bBar{width:74px;height:74px;right:calc(var(--sr) + 34px);bottom:calc(var(--sb) + 130px);background:rgba(160,110,255,.8);font-size:13px}

/* Overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(16,20,30,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px calc(var(--sr) + 16px) 16px calc(var(--sl) + 16px)}
.panel{max-width:520px;width:100%;text-align:center}
.panel h1{font-size:56px;margin:0;letter-spacing:.06em;font-weight:900;font-style:italic;color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.panel p{color:var(--muted);margin:6px 0 14px;font-size:15px}
.big{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 38px;font-size:20px;font-weight:900;letter-spacing:.04em}
.help{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
.appfoot{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.2);
  padding-top:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.appfoot b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.updBtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px}
.updBtn:disabled{opacity:.6}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:800;text-align:center;padding:24px}
#rotate span{font-size:60px;display:block;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="score"><span id="sc">0</span><small>Rekord trick: <span id="best">0</span></small></div>
  <button class="pauseBtn" id="bPause" aria-label="Paus">II</button>
</div>

<div id="stickZone"></div>
<div id="stickBase"><div id="stickKnob"></div></div>
<button class="act" id="bWhip">TAIL<br>WHIP</button>
<button class="act" id="bBar">BAR<br>SPIN</button>
<button class="act" id="bJump">HOPP</button>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>KICK</h1>
    <p>Åk runt i skateparken och gör trick i luften.</p>
    <button class="big" id="bStart">ÅK!</button>
    <div class="help">Joystick: åk och styr · HOPP: hoppa · BARSPIN: snurra styret · TAILWHIP: snurra decket<br>
      Tricks går bara i luften. Landa inte mitt i ett snurr! Ramperna ger högre luft.</div>
    <footer class="appfoot"><span>Version <b class="appver"></b></span><button type="button" class="updBtn">Uppdatera appen</button></footer>
  </div>
</div>

<div id="rotate"><span>📱</span>Vänd telefonen för att åka</div>

<script>
(function(){
'use strict';
const APP_VERSION='0.2';
const LS_BEST='kick:best';

/* ---------- Park ---------- */
const W=2200,H=1400,QP=140,QPH=85;
const G=820, ACC=430, MAXS=460, FRICT=55, SLOPE=650, TURN=3.4;
const BAR_DUR=0.30, WHIP_DUR=0.40;

const boxes=[{x:960,y:610,w:280,h:180,top:46}];
const kickers=[
  {x:960-160,y:700,ang:0,len:160,wid:150,h:46},          // upp på boxen från vänster
  {x:1240+160,y:700,ang:Math.PI,len:160,wid:150,h:46},   // upp på boxen från höger
  {x:420,y:330,ang:0.35,len:150,wid:110,h:50},
  {x:1700,y:1080,ang:Math.PI+0.3,len:150,wid:110,h:50},
  {x:480,y:1060,ang:-0.5,len:130,wid:100,h:42},
  {x:1760,y:330,ang:Math.PI-0.45,len:130,wid:100,h:42},
  {x:1100,y:300,ang:Math.PI/2,len:120,wid:120,h:38},
  {x:1100,y:1110,ang:-Math.PI/2,len:120,wid:120,h:38},
];
kickers.forEach(k=>{k.c=Math.cos(k.ang);k.s=Math.sin(k.ang);});

function qp(d){return d<QP?Math.pow(1-d/QP,2)*QPH:0;}
function ground(x,y){
  let h=Math.max(qp(x),qp(W-x),qp(y),qp(H-y));
  for(const b of boxes){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)h=Math.max(h,b.top);}
  for(const k of kickers){
    const dx=x-k.x,dy=y-k.y,u=dx*k.c+dy*k.s,v=-dx*k.s+dy*k.c;
    if(u>=0&&u<=k.len&&Math.abs(v)<=k.wid/2)h=Math.max(h,u/k.len*k.h);
  }
  return h;
}

/* ---------- State ---------- */
let best=0;try{best=+localStorage.getItem(LS_BEST)||0;}catch(e){}
const P={};
let score=0,running=false,popups=[];
function reset(){
  Object.assign(P,{x:W/2,y:H/2+260,ang:-Math.PI/2,vx:0,vy:0,z:0,vz:0,air:false,airT:0,
    flipTo:null,barT:0,whipT:0,barAng:0,whipAng:0,tricks:[],crashT:0});
}
reset();

/* ---------- Input ---------- */
const js={x:0,y:0,mag:0,ang:0,id:null};
const keys={};
const stickBase=document.getElementById('stickBase'),stickKnob=document.getElementById('stickKnob');
function restStick(){
  const sl=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sl'))||0;
  stickBase.style.left=(Math.max(sl,0)+100)+'px';stickBase.style.top=(innerHeight-100)+'px';
  stickKnob.style.transform='translate(0,0)';
}
let stickCx=0,stickCy=0;const R=55;
const zone=document.getElementById('stickZone');
zone.addEventListener('pointerdown',e=>{
  e.preventDefault();if(js.id!==null)return;js.id=e.pointerId;
  stickCx=Math.max(70,e.clientX);stickCy=Math.min(innerHeight-70,Math.max(70,e.clientY));
  stickBase.style.left=stickCx+'px';stickBase.style.top=stickCy+'px';moveStick(e);
});
window.addEventListener('pointermove',e=>{if(e.pointerId===js.id){e.preventDefault();moveStick(e);}},{passive:false});
function endStick(e){if(e.pointerId===js.id){js.id=null;js.x=js.y=js.mag=0;restStick();}}
window.addEventListener('pointerup',endStick);window.addEventListener('pointercancel',endStick);
function moveStick(e){
  let dx=e.clientX-stickCx,dy=e.clientY-stickCy;const d=Math.hypot(dx,dy);
  if(d>R){dx*=R/d;dy*=R/d;}
  stickKnob.style.transform=`translate(${dx}px,${dy}px)`;
  js.x=dx/R;js.y=dy/R;js.mag=Math.min(1,d/R);js.ang=Math.atan2(dy,dx);
}
function bindBtn(id,fn){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');fn();});
  const off=()=>b.classList.remove('on');
  b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
}
bindBtn('bJump',jump);bindBtn('bBar',barspin);bindBtn('bWhip',tailwhip);
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.repeat)return;
  if(e.key===' ')jump();if(e.key.toLowerCase()==='j')barspin();if(e.key.toLowerCase()==='k')tailwhip();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
function readKeys(){
  if(js.id!==null)return;
  const kx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  const ky=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(kx||ky){js.ang=Math.atan2(ky,kx);js.mag=1;}else js.mag=0;
}

/* ---------- Actions ---------- */
function jump(){
  if(!running||P.crashT>0||P.air)return;
  takeoff(330);
}
function barspin(){
  if(!running||!P.air||P.crashT>0||P.barT>0)return;
  P.barT=BAR_DUR;
}
function tailwhip(){
  if(!running||!P.air||P.crashT>0||P.whipT>0)return;
  P.whipT=WHIP_DUR;
}
function takeoff(vz){
  P.air=true;P.vz=vz;P.airT=0;P.tricks=[];
}

/* ---------- Tricks & scoring ---------- */
const N=['','','Double','Triple','Quad'];
function trickName(n,base,plural){return n===1?base:(N[n]?N[n]+' '+plural:n+'x '+plural);}
function land(){
  P.air=false;P.vz=0;
  if(P.flipTo!==null){P.ang=P.flipTo;P.flipTo=null;}
  if(P.barT>0||P.whipT>0){crash();return;}
  const nw=P.tricks.filter(t=>t==='whip').length,nb=P.tricks.filter(t=>t==='bar').length;
  if(nw+nb===0)return;
  const parts=[];
  if(nw)parts.push(trickName(nw,'Tailwhip','whip'));
  if(nb)parts.push(trickName(nb,'Barspin','barspin'));
  const n=nw+nb;
  const pts=Math.round((nw*150+nb*100)*n+P.airT*60);
  score+=pts;
  addPopup(parts.join(' + '),'+'+pts,'#fff');
  if(pts>best){best=pts;try{localStorage.setItem(LS_BEST,best);}catch(e){}addPopup('Nytt rekord!','','#ffd23a',0.4);}
  updHud();
}
function crash(){
  P.crashT=1.3;P.barT=P.whipT=0;P.barAng=P.whipAng=0;P.tricks=[];
  addPopup('Krasch!','','#ff5a5a');
}
function addPopup(t,sub,col,delay){popups.push({t,sub,col,life:1.8,delay:delay||0});}
function updHud(){document.getElementById('sc').textContent=score;document.getElementById('best').textContent=best;}

/* ---------- Physics ---------- */
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function update(dt){
  readKeys();
  if(P.crashT>0){
    P.crashT-=dt;P.vx*=Math.pow(0.02,dt);P.vy*=Math.pow(0.02,dt);
    moveFlat(dt);
    if(P.air){P.vz-=G*dt;P.z+=P.vz*dt;const gh=ground(P.x,P.y);if(P.z<=gh){P.z=gh;P.air=false;P.vz=0;}}
    if(P.crashT<=0){P.vx=P.vy=0;}
    return;
  }
  // trick timers
  if(P.barT>0){P.barT-=dt;P.barAng=(1-Math.max(P.barT,0)/BAR_DUR)*Math.PI*2;if(P.barT<=0){P.barT=0;P.barAng=0;P.tricks.push('bar');}}
  if(P.whipT>0){P.whipT-=dt;P.whipAng=(1-Math.max(P.whipT,0)/WHIP_DUR)*Math.PI*2;if(P.whipT<=0){P.whipT=0;P.whipAng=0;P.tricks.push('whip');}}

  if(!P.air){
    const hc=Math.cos(P.ang),hs=Math.sin(P.ang);
    let spd=P.vx*hc+P.vy*hs;
    if(js.mag>0.15){
      const diff=wrap(js.ang-P.ang);
      P.ang+=Math.max(-TURN*dt,Math.min(TURN*dt,diff))*(Math.abs(spd)>20||Math.abs(diff)>0.2?1:0.6);
      if(Math.abs(diff)<1.7){if(spd<MAXS)spd+=ACC*js.mag*dt*(spd<0?2:1);}
      else spd-=Math.sign(spd)*Math.min(Math.abs(spd),ACC*1.4*dt);
    }
    spd-=Math.sign(spd)*Math.min(Math.abs(spd),FRICT*dt);
    const gx=(ground(P.x+2,P.y)-ground(P.x-2,P.y))/4,gy=(ground(P.x,P.y+2)-ground(P.x,P.y-2))/4;
    const nc=Math.cos(P.ang),ns=Math.sin(P.ang);
    spd-=(gx*nc+gy*ns)*SLOPE*dt;
    P.vx=nc*spd;P.vy=ns*spd;
    const g0=ground(P.x,P.y);
    let nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
    // coping: launch from quarter pipe
    const out=nx<1?[-1,0]:nx>W-1?[1,0]:ny<1?[0,-1]:ny>H-1?[0,1]:null;
    if(out){
      const vn=P.vx*out[0]+P.vy*out[1];
      if(g0>QPH*0.6&&vn>40){
        P.vx-=out[0]*(vn+35);P.vy-=out[1]*(vn+35);
        P.x=Math.min(W-2,Math.max(2,nx));P.y=Math.min(H-2,Math.max(2,ny));
        P.z=g0;takeoff(vn*1.05+110);P.flipTo=Math.atan2(-out[1],-out[0]);
        return;
      }
      nx=Math.min(W-2,Math.max(2,nx));ny=Math.min(H-2,Math.max(2,ny));
    }
    const g1=ground(nx,ny);
    if(g1>g0+10){P.vx*=-0.3;P.vy*=-0.3;return;} // vägg
    if(g1<g0-3){
      const rate=(g0-ground(P.x-P.vx*dt,P.y-P.vy*dt))/dt;
      P.x=nx;P.y=ny;P.z=g0;
      takeoff(rate>30?rate*2.4+150:0);
      return;
    }
    P.x=nx;P.y=ny;P.z=g1;
  }else{
    P.airT+=dt;
    if(P.flipTo!==null){P.ang+=wrap(P.flipTo-P.ang)*Math.min(1,dt*5);}
    else if(js.mag>0.15){P.ang+=Math.max(-1.5*dt,Math.min(1.5*dt,wrap(js.ang-P.ang)));}
    moveFlat(dt);
    P.vz-=G*dt;P.z+=P.vz*dt;
    const gh=ground(P.x,P.y);
    if(P.z<=gh){P.z=gh;
      // landa – rikta åkaren efter farten om vi inte vänt i en ramp
      if(P.flipTo===null){const sp=Math.hypot(P.vx,P.vy);if(sp>40){const va=Math.atan2(P.vy,P.vx);if(Math.abs(wrap(va-P.ang))<1.6)P.ang=va;}}
      land();
    }
  }
}
function moveFlat(dt){
  let nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
  if(nx<2||nx>W-2){P.vx*=-0.4;nx=Math.min(W-2,Math.max(2,nx));}
  if(ny<2||ny>H-2){P.vy*=-0.4;ny=Math.min(H-2,Math.max(2,ny));}
  if(ground(nx,ny)>P.z+12){P.vx*=-0.4;P.vy*=-0.4;return;}
  P.x=nx;P.y=ny;
  if(!P.air)P.z=ground(P.x,P.y);
}

/* ---------- Rendering ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let cw=0,ch=0,dpr=1,zoom=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);cw=innerWidth;ch=innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  zoom=Math.max(0.45,Math.min(1.1,ch/640));
  restStick();
}
window.addEventListener('resize',resize);resize();

let floorPat=null;
function makeFloor(){
  const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');
  g.fillStyle='#8e9198';g.fillRect(0,0,200,200);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},0.04)`;g.fillRect(Math.random()*200,Math.random()*200,2,2);}
  g.strokeStyle='rgba(0,0,0,.14)';g.lineWidth=2;g.strokeRect(0,0,200,200);
  floorPat=ctx.createPattern(c,'repeat');
}
makeFloor();

function drawPark(){
  ctx.fillStyle='#2a303d';ctx.fillRect(-2000,-2000,W+4000,H+4000);
  ctx.fillStyle=floorPat;ctx.fillRect(0,0,W,H);
  // färg på golvet
  ctx.save();ctx.globalAlpha=.16;ctx.fillStyle='#ff7a1a';ctx.font='900 italic 220px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('KICK',W/2,H/2+300);ctx.restore();
  ctx.save();ctx.globalAlpha=.2;ctx.strokeStyle='#3ad1ff';ctx.lineWidth=14;ctx.beginPath();ctx.arc(W/2,H/2-40,420,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.restore();
  // quarter pipes
  const edge=(x0,y0,x1,y1,w,h)=>{const gr=ctx.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,'#8e9198');gr.addColorStop(0.55,'#a9acb3');gr.addColorStop(1,'#d3d6dc');ctx.fillStyle=gr;};
  edge(QP,0,0,0);ctx.fillRect(0,0,QP,H);
  edge(W-QP,0,W,0);ctx.fillRect(W-QP,0,QP,H);
  edge(0,QP,0,0);ctx.fillRect(QP,0,W-2*QP,QP);
  edge(0,H-QP,0,H);ctx.fillRect(QP,H-QP,W-2*QP,QP);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;ctx.strokeRect(QP,QP,W-2*QP,H-2*QP);
  ctx.strokeStyle='#e9edf3';ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8); // coping
  // boxar
  for(const b of boxes){
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(b.x+8,b.y+10,b.w,b.h);
    ctx.fillStyle='#b4b7be';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#e9edf3';ctx.lineWidth=6;ctx.strokeRect(b.x+3,b.y+3,b.w-6,b.h-6);
  }
  // kickers
  for(const k of kickers){
    ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.ang);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(10,-k.wid/2+8,k.len,k.wid);
    const gr=ctx.createLinearGradient(0,0,k.len,0);gr.addColorStop(0,'#7a5a3a');gr.addColorStop(1,'#d9b27a');
    ctx.fillStyle=gr;ctx.fillRect(0,-k.wid/2,k.len,k.wid);
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;
    for(let u=24;u<k.len;u+=24){ctx.beginPath();ctx.moveTo(u,-k.wid/2);ctx.lineTo(u,k.wid/2);ctx.stroke();}
    ctx.fillStyle='#e9edf3';ctx.fillRect(k.len-6,-k.wid/2,6,k.wid);
    ctx.restore();
  }
}

function drawRider(){
  const lift=P.z*0.6, s=1+P.z/260;
  const gh=ground(P.x,P.y);
  // skugga
  ctx.save();ctx.translate(P.x,P.y-gh*0.6);
  ctx.fillStyle=`rgba(0,0,0,${Math.max(.12,.35-(P.z-gh)/700)})`;
  ctx.beginPath();ctx.ellipse(0,0,30,14,P.ang,0,Math.PI*2);ctx.fill();ctx.restore();

  ctx.save();ctx.translate(P.x,P.y-lift);ctx.scale(s,s);ctx.rotate(P.ang);
  const crashed=P.crashT>0;
  if(crashed)ctx.rotate(Math.sin(P.crashT*18)*0.15);
  // deck (roterar runt styrstången vid tailwhip)
  ctx.save();ctx.translate(20,0);ctx.rotate(P.whipAng);ctx.translate(-20,0);
  ctx.fillStyle='#111';ctx.fillRect(-30,-5,10,10);ctx.fillRect(16,-5,10,10);   // hjul
  ctx.fillStyle='#ff7a1a';roundRect(-26,-7,46,14,6);ctx.fill();
  ctx.fillStyle='#222';roundRect(-22,-5,36,10,4);ctx.fill();
  ctx.restore();
  // styre (roterar vid barspin)
  ctx.fillStyle='#e9edf3';ctx.beginPath();ctx.arc(20,0,4,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(20,0);ctx.rotate(P.barAng);
  ctx.strokeStyle='#e9edf3';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,17);ctx.stroke();
  ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,-10);ctx.moveTo(0,10);ctx.lineTo(0,17);ctx.stroke();
  ctx.restore();
  // åkare
  const hands=P.barT<=0&&!crashed;
  ctx.strokeStyle='#2b6cff';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();
  if(hands){ctx.moveTo(2,-11);ctx.lineTo(19,-14);ctx.moveTo(2,11);ctx.lineTo(19,14);}
  else{ctx.moveTo(2,-11);ctx.lineTo(-4,-22);ctx.moveTo(2,11);ctx.lineTo(-4,22);}
  ctx.stroke();
  ctx.fillStyle='#2b6cff';ctx.beginPath();ctx.ellipse(0,0,9,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=crashed?'#ff5a5a':'#ffd23a';ctx.beginPath();ctx.arc(3,0,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(7,-5,3,10);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawPopups(dt){
  ctx.textAlign='center';ctx.textBaseline='middle';
  let yOff=0;
  for(const p of popups){
    if(p.delay>0){p.delay-=dt;continue;}
    p.life-=dt;const a=Math.min(1,p.life/0.5),rise=(1.8-p.life)*14;
    ctx.globalAlpha=Math.max(0,a);
    ctx.font='900 italic 30px system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.55)';
    const y=ch*0.26-rise+yOff;
    ctx.strokeText(p.t,cw/2,y);ctx.fillStyle=p.col;ctx.fillText(p.t,cw/2,y);
    if(p.sub){ctx.font='800 22px system-ui,sans-serif';ctx.strokeText(p.sub,cw/2,y+30);ctx.fillStyle='#ffd23a';ctx.fillText(p.sub,cw/2,y+30);}
    yOff+=60;
  }
  ctx.globalAlpha=1;popups=popups.filter(p=>p.life>0);
  // pågående trick i luften
  if(P.air&&P.tricks.length&&P.crashT<=0){
    ctx.font='800 18px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillText(P.tricks.map(t=>t==='whip'?'Whip':'Bar').join(' + '),cw/2,ch*0.14);
  }
}

function render(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const vw=cw/zoom,vh=ch/zoom;
  let camX=P.x,camY=P.y-P.z*0.3;
  camX=vw>=W?W/2:Math.max(vw/2-60,Math.min(W-vw/2+60,camX));
  camY=vh>=H?H/2:Math.max(vh/2-60,Math.min(H-vh/2+60,camY));
  ctx.save();ctx.translate(cw/2,ch/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
  drawPark();drawRider();
  ctx.restore();
  drawPopups(dt);
}

/* ---------- Loop & menu ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  if(running)update(dt);
  render(running?dt:0);
  requestAnimationFrame(frame);
}
const menu=document.getElementById('menu');
document.getElementById('bStart').addEventListener('click',()=>{menu.hidden=true;running=true;last=performance.now();});
document.getElementById('bPause').addEventListener('click',()=>{running=false;menu.hidden=false;document.getElementById('bStart').textContent='FORTSÄTT';});

document.querySelectorAll('.appver').forEach(el=>el.textContent=APP_VERSION);
document.querySelectorAll('.updBtn').forEach(btn=>btn.addEventListener('click',async()=>{
  document.querySelectorAll('.updBtn').forEach(b=>{b.disabled=true;b.textContent='Uppdaterar…';});
  try{
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})));}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('kick-')).map(k=>caches.delete(k)));}
  }catch(e){}
  location.reload();
}));
updHud();
window.__kick={P,ground,update,jump,barspin,tailwhip,js,start:()=>{menu.hidden=true;running=true;}};
requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
