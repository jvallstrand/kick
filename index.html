<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="1; url=../spel/kick/">
<title>Kick har flyttat</title>
<style>html,body{margin:0;height:100%;background:#1d2433;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
a{background:#ff7a1a;color:#fff;text-decoration:none;font-weight:900;border-radius:14px;padding:12px 24px;font-size:19px}</style>
</head>
<body>
<main><h1>Kick har flyttat till Spelhallen</h1><p>Dina rekord och din åkare följer med.</p><a href="../spel/kick/">Öppna Kick</a>
<p style="opacity:.7;font-size:14px">Ta bort den gamla Kick-ikonen och lägg till den nya från Spelhallen på hemskärmen.</p></main>
<script>
(async()=>{try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>new URL(r.scope).pathname.startsWith('/kick/')).map(r=>r.unregister()));}
  if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('kick-')).map(k=>caches.delete(k)));}
}catch(e){}location.replace('../spel/kick/');})();
</script>
</body>
</html>
